name: Generate Terminal GIF

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme to use (default | macos | debian)'
        required: false
        default: 'default'
      wallpaper:
        description: 'Wallpaper filename in assets/ for the debian theme (e.g. debian_dark_wallpaper.jpg)'
        required: false
        default: ''
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install github-readme-terminal requests python-dotenv Pillow

      - name: Patch gifos zero-division bug
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gifos.utils.fetch_github_stats as module

          path = Path(module.__file__)

          text = path.read_text()

          old = '''pull_requests_merge_percentage=round(
                (
                    user_stats["mergedPullRequests"]["totalCount"]
                    / user_stats["pullRequests"]["totalCount"]
                )
                * 100,
                2,
            ),'''

          new = '''pull_requests_merge_percentage=(
                round(
                    (
                        user_stats["mergedPullRequests"]["totalCount"]
                        / user_stats["pullRequests"]["totalCount"]
                    )
                    * 100,
                    2,
                )
                if user_stats["pullRequests"]["totalCount"] > 0
                else 0.0
            ),'''

          if old not in text:
              print(f"ERROR: Expected code not found in {path}")
              raise SystemExit(1)

          path.write_text(text.replace(old, new))

          print(f"SUCCESS: Patched {path}")
          PY

      - name: Inspect gifos GitHub stats code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "/opt/hostedtoolcache/Python/3.11.16/x64/"
              "lib/python3.11/site-packages/gifos/utils/fetch_github_stats.py"
          )

          lines = path.read_text().splitlines()

          for i in range(285, 305):
              print(f"{i + 1}: {lines[i]}")
          PY

      - name: Generate GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Automatically injected by GitHub — no changes needed when forking.
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Select theme via repo variable: Settings → Variables → Actions → THEME
          # Valid values: default | macos | debian   (fallback: default)
          THEME: ${{ vars.THEME || inputs.theme || 'default' }}
          # For the debian theme: filename of the wallpaper inside assets/
          # Set via repo variable WALLPAPER (e.g. debian_dark_wallpaper.jpg)
          # Leave empty to use the default (debian_wallpaper.png)
          WALLPAPER: ${{ vars.WALLPAPER || inputs.wallpaper || '' }}
        run: |
          echo "Theme: $THEME  |  Wallpaper: ${WALLPAPER:-default}  |  User: $GITHUB_REPOSITORY_OWNER"

          if [ -n "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is available"
          else
            echo "GITHUB_TOKEN is EMPTY"
          fi

          python3 -c 'import os; print("Python sees GITHUB_TOKEN:", bool(os.environ.get("GITHUB_TOKEN")))'
          
          # TEMP: gifos expects the token in a .env file (i think)
          echo "GITHUB_TOKEN=$GITHUB_TOKEN" > .env
          
          case "$THEME" in
            debian)  python3 generate_debian.py ;;
            default) python3 generate_with_stats.py ;;
            *)       python3 generate_liquid_glass.py ;;
          esac

          # TEMP
          rm -f .env

      - name: Check generated GIF
        run: |
          echo "=== Git status ==="
          git status --short

          echo "=== GIF file ==="
          ls -lh output.gif

          echo "=== GIF checksum ==="
          sha256sum output.gif

          echo "=== Git diff ==="
          git diff --stat -- output.gif

          echo "=== Staged diff ==="
          git diff --cached --stat -- output.gif

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output.gif
          if git diff --cached --quiet; then
            echo "No changes to output.gif - nothing to commit"
          else
            echo "Changes detected - committing and pushing..."
            git commit -m "Update terminal GIF [skip ci]"
            git push
          fi
